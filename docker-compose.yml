version: '3.9'
services:
    apache:
        image: fuzzy-palm-tree:latest
        build: ./
        expose:
            - "80"
        volumes:
            - storage_production:/var/www/html/storage
        depends_on:
            - mysql-production
        environment:
            - DB_CONNECTION=mysql
            - DB_HOST=mysql_production
            - DB_PORT=3306
            - DB_DATABASE=db
            - DB_USERNAME=root
            - DB_PASSWORD=rootpass
            - PHP_UPLOAD_MAX_FILESIZE=100M
            - PHP_POST_MAX_SIZE=100M
            - PHP_MEMORY_LIMIT=256M
            - PHP_MAX_EXECUTION_TIME=600
        networks:
            - dokploy-network

    mysql-production:
        container_name: mysql_production
        image: mysql:latest
        environment:
            MYSQL_ROOT_PASSWORD: rootpass
            MYSQL_DATABASE: db
            MYSQL_USER: user
            MYSQL_PASSWORD: pass
        volumes:
            - mysql_production_data:/var/lib/mysql
        networks:
            - dokploy-network

networks:
    dokploy-network:
        external: true

volumes:
    storage_production:
    mysql_production_data:
